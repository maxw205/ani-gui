<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnimeCLI</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">AnimeCLI</div>
    <form id="search-form" class="search" autocomplete="off">
      <input id="search" type="search" placeholder="Search anime…" spellcheck="false" autofocus>
      <button class="primary" type="submit">Search</button>
    </form>
    <button id="history-btn" type="button">History</button>
    <div class="options">
      <div class="segmented" role="radiogroup" aria-label="Audio">
        <button type="button" role="radio" data-mode="sub" aria-checked="true">Sub</button>
        <button type="button" role="radio" data-mode="dub" aria-checked="false">Dub</button>
      </div>
      <label class="quality">Quality
        <select id="quality">
          <option value="best">best</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="worst">worst</option>
        </select>
      </label>
      <label class="quality">Upscaler
        <select id="upscaler" title="ArtCNN upscaling shaders, run by mpv while you watch">
          <option value="off">Off</option>
          <optgroup label="ArtCNN C4F32 · best quality">
            <option value="c4f32">C4F32</option>
            <option value="c4f32-ds">C4F32 DS · denoise + sharpen</option>
            <option value="c4f32-dn">C4F32 DN · denoise + soften</option>
          </optgroup>
          <optgroup label="ArtCNN C4F16 · lighter on the GPU">
            <option value="c4f16">C4F16</option>
            <option value="c4f16-ds">C4F16 DS · denoise + sharpen</option>
            <option value="c4f16-dn">C4F16 DN · denoise + soften</option>
          </optgroup>
        </select>
      </label>
      <button id="upscale-hint" type="button" class="hint" hidden
        title="ArtCNN only runs when the video is drawn at least 1.3× bigger than the stream. On a 1080p screen, stream 720p and watch fullscreen.">Use 720p</button>
    </div>
  </header>

  <main class="body">
    <aside class="panel list-panel">
      <div id="list-label" class="panel-label">Results</div>
      <ul id="list" class="list"></ul>
    </aside>
    <section id="detail" class="panel detail">
      <div id="player-area" class="player-area" hidden>
        <div class="player-frame">
          <!-- mpv draws into a native window that the app keeps over this box -->
          <div id="video-slot" class="video-slot"><span class="video-loading">Loading video…</span></div>
          <!-- nothing can be drawn over the video itself, so the controls sit right under it -->
          <div id="video-controls" class="video-controls">
            <button id="vc-play" type="button" class="vc-btn" title="Pause (space)" aria-label="Pause">
              <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
              <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
            </button>
            <button id="vc-back" type="button" class="vc-btn" title="Back 10 seconds (←)" aria-label="Back 10 seconds">
              <svg viewBox="0 0 24 24" class="stroke"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/><text x="12" y="15.5" text-anchor="middle">10</text></svg>
            </button>
            <button id="vc-fwd" type="button" class="vc-btn" title="Forward 10 seconds (→)" aria-label="Forward 10 seconds">
              <svg viewBox="0 0 24 24" class="stroke"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/><text x="12" y="15.5" text-anchor="middle">10</text></svg>
            </button>
            <span id="vc-time" class="vc-time">0:00 / 0:00</span>
            <div class="vc-seek">
              <div class="vc-track"><div id="vc-buffer" class="vc-buffer"></div><div id="vc-progress" class="vc-progress"></div></div>
              <input id="vc-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
            </div>
            <button id="vc-mute" type="button" class="vc-btn" title="Mute (m)" aria-label="Mute">
              <svg class="i-vol stroke" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
              <svg class="i-muted stroke" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
            </button>
            <input id="vc-volume" class="vc-volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
            <select id="vc-speed" class="vc-speed" title="Playback speed" aria-label="Playback speed">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
            <button id="vc-subs" type="button" class="vc-btn vc-cc" title="Subtitles (c)" aria-label="Subtitles" aria-pressed="true">CC</button>
            <button id="fs-btn" type="button" class="vc-btn" title="Fullscreen (f or double-click the video; Esc to leave)" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24" class="stroke"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="detail-scroll" class="detail-scroll">
      <div id="banner" class="banner" hidden></div>
      <div class="detail-head">
        <img id="cover" class="cover" alt="" hidden>
        <div class="detail-text">
          <h1 id="title">Search for an anime to get started</h1>
          <p id="alt-title" class="alt-title" hidden></p>
          <div id="facts" class="chips" hidden></div>
          <div id="genres" class="chips genres" hidden></div>
          <p id="airing" class="airing" hidden></p>
          <div id="desc-wrap" class="desc-wrap" hidden>
            <p id="desc" class="desc"></p>
            <button id="desc-toggle" type="button" class="ghost link" hidden>More</button>
          </div>
        </div>
      </div>
      <div class="ep-bar">
        <p id="info" class="muted">Type a name above and press Enter.</p>
        <span id="credit" class="credit" hidden>Details from AniList</span>
        <select id="page" hidden aria-label="Episode range"></select>
      </div>
      <div id="episodes" class="episodes"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="panel player">
      <div id="now" class="now">Nothing playing</div>
      <label class="check" title="Switch to fullscreen as soon as an episode starts"><input id="fullscreen" type="checkbox"> Start fullscreen</label>
      <label class="check"><input id="autoplay" type="checkbox"> Autoplay next</label>
      <button id="prev" type="button">⏮&nbsp; Previous</button>
      <button id="replay" type="button">↻&nbsp; Replay</button>
      <button id="next" type="button">Next &nbsp;⏭</button>
      <button id="stop" type="button">■&nbsp; Stop</button>
    </div>
    <div class="statusbar">
      <span id="status" class="muted">Ready</span>
      <button id="log-btn" type="button" class="ghost">Show log</button>
    </div>
    <pre id="log" class="log" hidden></pre>
  </footer>

  <dialog id="menu-dialog">
    <form method="dialog">
      <p id="menu-prompt"></p>
      <select id="menu-options" size="8"></select>
      <div class="dialog-buttons">
        <button value="cancel" type="submit">Cancel</button>
        <button value="ok" type="submit" class="primary">OK</button>
      </div>
    </form>
  </dialog>
</body>
</html>
